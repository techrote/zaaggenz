<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>zaaggenz vocal gesture</title><link rel="stylesheet" href="/vocal/style.css"></head><body><header><h1>Local vocal gesture</h1><nav><a href="/timeline">Compose timeline</a> <a href="/">Full instrument</a></nav></header><main><section><h2>Local source</h2><label>Import WAV<input id="file" type="file" accept="audio/wav,.wav"></label><button id="record">Start recording</button><button id="stop-record" disabled>Stop recording</button><button id="discard" disabled>Discard source audio</button><audio id="source-audio" controls></audio><p id="record-state">Idle. Recording is optional; WAV import is always available.</p></section><section><h2>Analyse and correct</h2><select id="dictionary"></select><select id="grid"><option value="1/4">1/4</option><option value="1/8">1/8</option><option value="1/12">1/12</option></select><button id="analyse" disabled>Analyse capture</button><button id="undo" disabled>Undo</button><button id="redo" disabled>Redo</button><div id="segments"></div></section><section><h2>Preview and apply</h2><button id="compile" disabled>Update preview</button><button id="render" disabled>Render preview</button><button id="apply" disabled>Export editable timeline</button><p id="status">No capture loaded.</p><audio id="render-audio" controls></audio><pre id="preview">Unvoiced regions remain unpitched until corrected.</pre></section></main><script type="module" src="/vocal/app.mjs"></script></body></html>

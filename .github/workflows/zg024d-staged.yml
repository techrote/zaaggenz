name: ZG-024d staged deterministic confirmation
on:
  pull_request:
    paths:
      - 'research/zg024d/**'
      - 'research/zg024b/**'
      - 'tests/inverse_research/**'
      - 'tests/inverse/**'
      - 'tools/inverse_staged_report.py'
      - 'examples/zg024d_staged_confirmation.json'
      - 'docs/inverse/**'
      - '.github/workflows/zg024d-staged.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staged-confirmation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Materialize authenticated unmodified baseline
        run: python baseline/recovered_source/materialize_v2.py --out .
      - name: Install declared dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 -r requirements-contracts.txt -r requirements-jobs.txt
      - name: ZG-024d staged protocol and adversarial tests
        run: python -m unittest tests.inverse_research.test_staged_search -v
      - name: Frozen ZG-024b strategy regressions
        run: python -m unittest tests.inverse_research.test_strategies tests.inverse_research.test_fixtures -v
      - name: Frozen ZG-024a laboratory regressions
        run: python -m unittest discover -s tests/inverse -v
      - name: Materialize preregistered development and sealed-confirmation evidence
        run: >-
          python tools/inverse_staged_report.py
          --out zg024d-evidence.json
          --full-out zg024d-full.json.gz
          --telemetry-out zg024d-telemetry.json
          --reference-out zg024d-portable-reference.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zg024d-staged-confirmation-${{ matrix.os }}
          path: |
            zg024d-evidence.json
            zg024d-full.json.gz
            zg024d-telemetry.json
            zg024d-portable-reference.json
          retention-days: 7
          compression-level: 9

name: ZG-032 local vocal gesture capture
on:
  pull_request:
    paths:
      - 'zaaggenz_vocal/**'
      - 'web/vocal/**'
      - 'tests/vocal/**'
      - 'tools/vocal_fixture_report.py'
      - 'docs/vocal/**'
      - '.github/workflows/zg032-vocal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vocal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Capture exact tracked source
        run: git archive --format=zip --output=verification-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: zg032-source-${{ matrix.os }}
          path: verification-source.zip
          retention-days: 7
      - name: Materialize authenticated v1.2.1 source
        run: python baseline/recovered_source/materialize_v2.py --out .
      - name: Install numerical, shared and browser-test dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 -r requirements-contracts.txt -r requirements-jobs.txt playwright==1.57.0
      - name: Install Chromium with Linux dependencies
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: python -m playwright install chromium
      - name: Capture confidence, abstention, correction, source lifecycle and HTTP tests
        run: python -m unittest discover -s tests/vocal -v
      - name: Browser editor history and recording-style WAV encoding
        run: node tests/vocal/editor.mjs
      - name: Accepted text, gesture, analysis, components and Compose regressions
        run: |
          python -m unittest discover -s tests/textgesture -v
          python -m unittest discover -s tests/gesture -v
          python -m unittest discover -s tests/analysis -v
          python -m unittest discover -s tests/components -v
          python -m unittest discover -s tests/timeline -v
      - name: Full-rate quantified clean and recording-path fixtures
        run: python tools/vocal_fixture_report.py --out vocal-fixtures-48k.json --artifact-dir vocal-evidence-48k --sample-rate 48000
      - name: Real browser import, correction, preview, source discard and Compose export
        run: python tests/vocal/browser.py --out vocal-browser-acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zg032-vocal-${{ matrix.os }}
          path: |
            vocal-fixtures-48k.json
            vocal-evidence-48k/
            vocal-browser-acceptance/

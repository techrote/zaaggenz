name: ZG-005 audio QC
on:
  pull_request:
    paths:
      - 'zaaggenz_qc/**'
      - 'tests/qc/**'
      - 'tools/run_qc.py'
      - 'docs/qc/**'
      - '.github/workflows/zg005-qc.yml'
permissions:
  contents: read
jobs:
  qc:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env: {PYTHONUTF8: '1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Materialize authenticated baseline
        run: python baseline/recovered_source/materialize_v2.py --out .
      - name: Install numerical dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 -r requirements-contracts.txt
      - name: Run QC tests
        run: python -m unittest discover -s tests/qc -v
      - name: Materialize deterministic small-CI report
        run: python tools/run_qc.py --sample-rate 12000 --out qc-report.json
      - uses: actions/upload-artifact@v4
        with: {name: 'qc-${{ matrix.os }}', path: qc-report.json}

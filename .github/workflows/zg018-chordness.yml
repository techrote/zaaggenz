name: ZG-018 multi-comb chordness
on:
  pull_request:
    paths:
      - 'zaaggenz_spectral/**'
      - 'tests/spectral/**'
      - 'tools/chordness_report.py'
      - 'docs/spectral/**'
      - '.github/workflows/zg018-chordness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chordness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env: {PYTHONUTF8: '1', OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 -r requirements-contracts.txt -r requirements-jobs.txt
      - name: Spectral acceptance tests
        run: python -m unittest discover -s tests/spectral -v
      - name: Descriptor and component regressions
        run: |
          python -m unittest discover -s tests/descriptors -v
          python -m unittest discover -s tests/components -v
      - name: Full-rate deterministic evidence
        run: python tools/chordness_report.py --sample-rate 48000 --out chordness-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chordness-evidence-${{ matrix.os }}
          path: chordness-evidence.json

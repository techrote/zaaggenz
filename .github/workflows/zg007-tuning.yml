name: ZG-007 tuning primitives
on:
  pull_request:
    paths:
      - 'zaaggenz_tuning/**'
      - 'tests/tuning/**'
      - 'examples/tuning/**'
      - 'docs/tuning/**'
      - '.github/workflows/zg007-tuning.yml'
permissions:
  contents: read
jobs:
  tuning:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env: {PYTHONUTF8: '1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install contract dependencies
        run: python -m pip install -r requirements-contracts.txt
      - name: Tuning tests
        run: python -m unittest discover -s tests/tuning -v

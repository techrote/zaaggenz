name: ZG-004 bounded async jobs
on:
  pull_request:
    paths:
      - 'zaaggenz_jobs/**'
      - 'web/jobs_transport.mjs'
      - 'tests/jobs/**'
      - 'tools/benchmark_jobs.py'
      - 'requirements-jobs.txt'
      - '.github/workflows/zg004-jobs.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jobs:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Materialize authenticated baseline
        run: python baseline/recovered_source/materialize_v2.py --out .
      - name: Install dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 -r requirements-contracts.txt -r requirements-jobs.txt
      - name: Scheduler and publication tests
        run: python -m unittest discover -s tests/jobs -v
      - name: Browser stale-result tests
        run: node tests/jobs/browser_transport.mjs
      - name: Host-scoped baseline preview benchmark
        run: python tools/benchmark_jobs.py --baseline --out jobs-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jobs-benchmark-${{ matrix.os }}
          path: jobs-benchmark.json

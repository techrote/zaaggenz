name: ZG-019 spectral nonlinear placement
on:
  pull_request:
    paths:
      - 'zaaggenz_dsp/**'
      - 'zaaggenz_contracts/registry.py'
      - 'zaaggenz_spectral/**'
      - 'tests/dsp/**'
      - 'tests/spectral/**'
      - 'tools/spectral_placement_report.py'
      - 'examples/zg019_placement_benchmarks.json'
      - 'docs/dsp/**'
      - '.github/workflows/zg019-placement.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  placement:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env: {PYTHONUTF8: '1', OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Materialize authenticated legacy baseline
        run: python baseline/recovered_source/materialize_v2.py --out .
      - name: Install dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 -r requirements-contracts.txt -r requirements-jobs.txt
      - name: DSP graph and antialias regressions
        run: python -m unittest discover -s tests/dsp -v
      - name: Spectral placement and inherited spectral regressions
        run: python -m unittest discover -s tests/spectral -v
      - name: Frozen 48 kHz placement and alias evidence
        run: python tools/spectral_placement_report.py --out spectral-placement-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spectral-placement-evidence-${{ matrix.os }}
          path: spectral-placement-evidence.json

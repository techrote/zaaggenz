name: ZG-026 nested meter and cross-rhythms
on:
  pull_request:
    paths:
      - 'zaaggenz_meter/**'
      - 'tests/meter/**'
      - 'tools/meter_fixture_report.py'
      - 'docs/meter/**'
      - '.github/workflows/zg026-meter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  meter:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Capture exact tracked source
        run: git archive --format=zip --output=verification-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: zg026-source-${{ matrix.os }}
          path: verification-source.zip
          retention-days: 7
      - name: Materialize authenticated v1.2.1 source
        run: python baseline/recovered_source/materialize_v2.py --out .
      - name: Install numerical and shared dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 -r requirements-contracts.txt -r requirements-jobs.txt
      - name: Exact clocks, tempo maps, resets, control lanes and ambiguity overlays
        run: python -m unittest discover -s tests/meter -v
      - name: Accepted analysis and phrase regressions
        run: |
          python -m unittest discover -s tests/analysis -v
          python -m unittest discover -s tests/phrase -v
      - name: Full-rate matched clock fixtures
        run: python tools/meter_fixture_report.py --out meter-fixtures-48k.json --audio-dir meter-clicks-48k --sample-rate 48000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zg026-meter-${{ matrix.os }}
          path: |
            meter-fixtures-48k.json
            meter-clicks-48k/

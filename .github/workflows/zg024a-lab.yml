name: ZG-024a inverse laboratory
on:
  pull_request:
    paths:
      - 'zaaggenz_inverse/**'
      - 'tests/inverse/**'
      - 'tools/inverse_foundation_report.py'
      - 'tools/check_inverse_regressions.py'
      - 'examples/zg024a_inverse_baseline.json'
      - 'docs/inverse/**'
      - 'zaaggenz_contracts/**'
      - 'zaaggenz_project/**'
      - 'zaaggenz_jobs/**'
      - 'zaaggenz_qc/**'
      - 'zaaggenz_analysis/**'
      - 'zaaggenz_components/**'
      - 'zaaggenz_descriptors/**'
      - 'zaaggenz_dsp/**'
      - 'zaaggenz_spectral/**'
      - 'zaaggenz_tuning/**'
      - 'baseline/recovered_source/**'
      - '.github/workflows/zg024a-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inverse:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install inherited dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 -r requirements-contracts.txt -r requirements-jobs.txt
      - name: Materialise authenticated recovered baseline
        run: python baseline/recovered_source/materialize_v2.py --out .
      - name: Inverse contracts and adversarial acceptance
        run: python -m unittest discover -s tests/inverse -v
      - name: Inherited regressions and all recovered smoke scripts
        run: python tools/check_inverse_regressions.py
      - name: Repeated-identity and portable baseline evidence
        run: python tools/inverse_foundation_report.py --out inverse-evidence.json --full-dir inverse-records --compare examples/zg024a_inverse_baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zg024a-evidence-${{ matrix.os }}
          path: |
            inverse-evidence.json
            inverse-records/
          retention-days: 14

name: ZG-009 practical timeline
on:
  pull_request:
    paths:
      - 'zaaggenz_timeline/**'
      - 'web/timeline/**'
      - 'web/jobs_transport.mjs'
      - 'tests/timeline/**'
      - 'docs/timeline/**'
      - '.github/workflows/zg009-timeline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  timeline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Capture tracked source
        run: git archive --format=zip --output=verification-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: zg009-source-${{ matrix.os }}
          path: verification-source.zip
          retention-days: 7
      - name: Materialize authenticated legacy source
        run: python baseline/recovered_source/materialize_v2.py --out .
      - name: Install numerical, contract, job and browser dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 -r requirements-contracts.txt -r requirements-jobs.txt playwright==1.57.0
      - name: Install Chromium with Linux dependencies
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: python -m playwright install chromium
      - name: Timeline model, audio, HTTP and isolation tests
        run: python -m unittest discover -s tests/timeline -v
      - name: Deterministic editing and existing stale-result gate
        run: |
          node tests/timeline/editor.mjs
          node tests/jobs/browser_transport.mjs
      - name: Melody and grammar regressions
        run: |
          python -m unittest discover -s tests/melody -v
          python -m unittest discover -s tests/grammar -v
      - name: Real browser editing, save/reopen, playback and 48 kHz evidence
        run: python tests/timeline/browser.py --out timeline-browser-48k --sample-rate 48000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zg009-timeline-${{ matrix.os }}
          path: timeline-browser-48k/

name: ZG-000 reverse-dependency CI impact

on:
  pull_request:
    paths:
      - 'zaaggenz_*/**'
      - 'tests/contracts/test_nyquismic.py'
      - 'tests/contracts/test_nyquismic_kernel_policy.py'
      - 'tests/contracts/nyquismic_oracles.py'
      - 'tests/contracts/fixtures/nyquismic*.json'
      - 'tests/dsp/test_nyquismic_sampler.py'
      - 'tests/dsp/nyquismic_audio_oracles.py'
      - 'tools/nyq002_report.py'
      - 'baseline/recovered_source/**'
      - 'web/**'
      - 'research/**'
      - 'requirements-*.txt'
      - 'programme/dependency_graph.json'
      - 'programme/ci_reverse_dependencies.json'
      - 'tools/ci_reverse_dependencies.py'
      - 'tools/zg000_reconcile.py'
      - 'tests/programme/**'
      - '.github/workflows/zg*.yml'
  workflow_dispatch:

# Auto generations supersede only their own PR; manual runs are audit-only.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}-pr-{2}', github.repository, github.workflow, github.event.pull_request.number) || format('{0}-{1}-manual-{2}', github.repository, github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write

jobs:
  impact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has_work: ${{ steps.select.outputs.has_work }}
      native: ${{ steps.select.outputs.native }}
      direct: ${{ steps.select.outputs.direct }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Validate workflow ownership and source coverage
        run: python tools/ci_reverse_dependencies.py --validate
      - name: Validate programme evidence state
        run: python tools/validate_programme_state.py --validate
      - name: Regression-test representative impact selections
        run: python -m unittest discover -s tests/programme -p 'test_ci_reverse_dependencies.py' -v
      - name: Regression-test exact-head dispatcher
        run: python -m unittest discover -s tests/programme -p 'test_zg000_reconcile.py' -v
      - name: Emit audit table
        run: python tools/ci_reverse_dependencies.py --audit > ci-reverse-dependency-audit.md
      - uses: actions/upload-artifact@v4
        with:
          name: zg000-ci-impact-audit
          path: ci-reverse-dependency-audit.md
          retention-days: 7
      - name: Collect changed paths
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > changed-files.txt
          else
            : > changed-files.txt
          fi
          cat changed-files.txt
      - name: Select required downstream workflow coverage
        id: select
        run: python tools/ci_reverse_dependencies.py --changed-file-list changed-files.txt --github-output "$GITHUB_OUTPUT"


  dispatcher-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Validate dispatcher Python syntax
        run: python -m py_compile tools/zg000_reconcile.py
      - name: Run deterministic dispatcher/identity tests
        run: python -m unittest discover -s tests/programme -p 'test_zg000_reconcile.py' -v

  dispatch:
    needs: [impact, dispatcher-regression]
    if: >-
      needs.impact.outputs.has_work == 'true' &&
      needs.dispatcher-regression.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      watch_matrix: ${{ steps.dispatch.outputs.watch_matrix }}
      has_runs: ${{ steps.dispatch.outputs.has_runs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Reconcile and dispatch exact-head downstream workflows serially
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          ZG000_MATRIX_JSON: ${{ needs.impact.outputs.matrix }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          python tools/zg000_reconcile.py dispatch \
            --pr "$PR" --sha "$SHA" --ref "$REF" \
            --manifest zg000-dispatch-manifest.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zg000-dispatch-manifest
          path: zg000-dispatch-manifest.json
          if-no-files-found: warn
          retention-days: 7

  watch:
    needs: [impact, dispatch]
    if: >-
      always() &&
      needs.dispatch.result == 'success' &&
      needs.dispatch.outputs.has_runs == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.dispatch.outputs.watch_matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Verify source and attempt before watching
        env:
          GH_TOKEN: ${{ github.token }}
          ROW_JSON: ${{ toJSON(matrix) }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: python tools/zg000_reconcile.py verify-run --pr "$PR" --sha "$SHA" --ref "$REF" --row-json "$ROW_JSON"
      - name: Wait for required downstream run without launching another
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ matrix.run_id }}
        shell: bash
        run: gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --interval 30 --exit-status
      - name: Verify authoritative terminal identity, attempt and result
        env:
          GH_TOKEN: ${{ github.token }}
          ROW_JSON: ${{ toJSON(matrix) }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REF: ${{ github.event.pull_request.head.ref }}
          ZG000_REQUIRE_COMPLETE: 'true'
        shell: bash
        run: python tools/zg000_reconcile.py verify-run --pr "$PR" --sha "$SHA" --ref "$REF" --row-json "$ROW_JSON"

  finalize:
    needs: [impact, dispatcher-regression, dispatch, watch]
    if: >-
      always() &&
      needs.impact.outputs.has_work == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/download-artifact@v4
        if: needs.dispatch.result == 'success' || needs.dispatch.result == 'failure'
        with:
          name: zg000-dispatch-manifest
          path: .
      - name: Make final exact-head qualification decision
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REF: ${{ github.event.pull_request.head.ref }}
          WATCH_RESULT: ${{ needs.watch.result }}
          DISPATCH_RESULT: ${{ needs.dispatch.result }}
          REGRESSION_RESULT: ${{ needs.dispatcher-regression.result }}
        shell: bash
        run: |
          if [ "$DISPATCH_RESULT" != success ] || [ "$REGRESSION_RESULT" != success ]; then
            echo "Required dispatcher or regression job failed: $DISPATCH_RESULT/$REGRESSION_RESULT" >&2
            exit 1
          fi
          python tools/zg000_reconcile.py finalize --pr "$PR" --sha "$SHA" \
            --ref "$REF" --watcher-result "$WATCH_RESULT" \
            --manifest zg000-dispatch-manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zg000-reconciliation-final
          path: zg000-dispatch-manifest.json
          if-no-files-found: warn
          retention-days: 7

  fork-policy:
    needs: impact
    if: >-
      needs.impact.outputs.has_work == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed when downstream dispatch capability is unavailable
        run: |
          echo "Reverse-dependency workflows are required, but pull-request fork tokens cannot safely dispatch privileged workflow runs." >&2
          echo "A maintainer must reproduce this head in a trusted branch before merge." >&2
          exit 1

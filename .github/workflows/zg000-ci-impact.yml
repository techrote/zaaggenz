name: ZG-000 reverse-dependency CI impact

on:
  pull_request:
    paths:
      - 'zaaggenz_*/**'
      - 'baseline/recovered_source/**'
      - 'web/**'
      - 'research/**'
      - 'requirements-*.txt'
      - 'programme/dependency_graph.json'
      - 'programme/ci_reverse_dependencies.json'
      - 'tools/ci_reverse_dependencies.py'
      - 'tests/programme/**'
      - '.github/workflows/zg*.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  impact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has_work: ${{ steps.select.outputs.has_work }}
      native: ${{ steps.select.outputs.native }}
      direct: ${{ steps.select.outputs.direct }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Validate workflow ownership and source coverage
        run: python tools/ci_reverse_dependencies.py --validate
      - name: Regression-test representative impact selections
        run: python -m unittest discover -s tests/programme -p 'test_ci_reverse_dependencies.py' -v
      - name: Emit audit table
        run: python tools/ci_reverse_dependencies.py --audit > ci-reverse-dependency-audit.md
      - uses: actions/upload-artifact@v4
        with:
          name: zg000-ci-impact-audit
          path: ci-reverse-dependency-audit.md
          retention-days: 7
      - name: Collect changed paths
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > changed-files.txt
          else
            : > changed-files.txt
          fi
          cat changed-files.txt
      - name: Select only missing downstream workflow runs
        id: select
        run: python tools/ci_reverse_dependencies.py --changed-file-list changed-files.txt --github-output "$GITHUB_OUTPUT"

  dispatch:
    needs: impact
    if: >-
      needs.impact.outputs.has_work == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      watch_matrix: ${{ steps.dispatch.outputs.watch_matrix }}
      has_runs: ${{ steps.dispatch.outputs.has_runs }}
    steps:
      - name: Dispatch required downstream workflows serially
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX_JSON: ${{ needs.impact.outputs.matrix }}
          REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import time

          rows = json.loads(os.environ['MATRIX_JSON'])
          repo = os.environ['GITHUB_REPOSITORY']
          ref = os.environ['REF']
          head_sha = os.environ['HEAD_SHA']

          def run_gh(args):
              cp = subprocess.run(['gh', *args], text=True, capture_output=True)
              if cp.stdout:
                  print(cp.stdout, end='')
              if cp.stderr:
                  print(cp.stderr, end='', file=sys.stderr)
              return cp

          def latest_for_head(workflow):
              cp = run_gh([
                  'run', 'list', '--repo', repo, '--workflow', workflow,
                  '--branch', ref, '--event', 'workflow_dispatch', '--limit', '30',
                  '--json', 'databaseId,headSha,createdAt',
              ])
              if cp.returncode:
                  return None
              candidates = [r for r in json.loads(cp.stdout or '[]') if r.get('headSha') == head_sha]
              candidates.sort(key=lambda r: r.get('createdAt', ''), reverse=True)
              return candidates[0]['databaseId'] if candidates else None

          watch = []
          for index, row in enumerate(rows):
              workflow = row['workflow']
              stable_id = row['stable_id']
              before_id = latest_for_head(workflow)
              print(f'Dispatching {workflow} ({stable_id}) at {ref} / {head_sha}; previous run: {before_id or "none"}')

              dispatched = False
              for attempt, delay in enumerate((0, 30, 90), start=1):
                  if delay:
                      print(f'Retrying dispatch after {delay}s backoff (attempt {attempt}/3)')
                      time.sleep(delay)
                  cp = run_gh(['workflow', 'run', workflow, '--repo', repo, '--ref', ref])
                  if cp.returncode == 0:
                      dispatched = True
                      break
              if not dispatched:
                  raise SystemExit(f'workflow dispatch failed after bounded retries: {workflow}')

              run_id = None
              for delay in (10, 30, 60):
                  time.sleep(delay)
                  candidate = latest_for_head(workflow)
                  if candidate is not None and candidate != before_id:
                      run_id = candidate
                      break
              if run_id is None:
                  raise SystemExit(f'dispatch succeeded but the new run could not be identified: {workflow}')

              print(f'Recorded downstream run {run_id} for {workflow}')
              watch.append({'workflow': workflow, 'stable_id': stable_id, 'run_id': str(run_id)})
              if index + 1 < len(rows):
                  time.sleep(5)

          compact = json.dumps(watch, separators=(',', ':'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'watch_matrix={compact}\n')
              out.write(f'has_runs={"true" if watch else "false"}\n')
          PY

  watch:
    needs: [impact, dispatch]
    if: >-
      always() &&
      needs.dispatch.result == 'success' &&
      needs.dispatch.outputs.has_runs == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.dispatch.outputs.watch_matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Require dispatched accepted workflow
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ matrix.workflow }}
          STABLE_ID: ${{ matrix.stable_id }}
          RUN_ID: ${{ matrix.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for $WORKFLOW ($STABLE_ID), run $RUN_ID"
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --interval 60 --exit-status

  fork-policy:
    needs: impact
    if: >-
      needs.impact.outputs.has_work == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed when downstream dispatch capability is unavailable
        run: |
          echo "Reverse-dependency workflows are required, but pull-request fork tokens cannot safely dispatch privileged workflow runs." >&2
          echo "A maintainer must reproduce this head in a trusted branch before merge." >&2
          exit 1

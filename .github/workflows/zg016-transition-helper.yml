name: ZG-016 reviewed transition helper

on:
  push:
    branches:
      - repair/zg016-107-automation-capability
    paths:
      - .github/workflows/zg016-transition-helper.yml

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/zg016-107-automation-capability
          fetch-depth: 0
      - name: Append exact reviewed transition and remove helper
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('examples/zg024a_implementation_transitions.json')
          document = json.loads(path.read_text(encoding='utf-8'))
          row = {
              'from_implementation_sha256': 'ff938e70ba2598d5f6f6f0bc305e01b580c373a8e5daca849e8d3f9392bee3a4',
              'to_implementation_sha256': 'a72df43b7519f8f08818db396556bb1d1e730ff146991279e8efcfb499b2e761',
              'issue': 107,
              'stable_id': 'ZG-016',
              'changed_paths': [
                  'zaaggenz_contracts/registry.py',
                  'zaaggenz_contracts/validation.py',
                  'zaaggenz_dsp/graph.py',
              ],
              'reason': 'Cumulative accepted implementation candidate after the recorded repair-path predecessors through #127 plus #107. DSP automation admission now consumes the same registry x-automatable capability in shared DSPNodeSpec semantic validation and graph execution, so unsupported numeric, boolean, integer/enum, crossover, antialiased and legacy parameters fail before rendering while the already-supported gain/tanh/hard-clip lanes retain their existing units, bounds and sample-domain interpolation. The first #107 ZG-024a run passed inverse contracts, all inherited prerequisite suites and browser transport on Ubuntu and Windows; both platforms computed the same implementation identity and stopped only at the intentionally fail-closed unreviewed implementation-identity gate. This exact transition permits only implementation_sha256 to differ; the rerun must reproduce the frozen portable calibration on Ubuntu and Windows before merge.'
          }
          key = (row['from_implementation_sha256'], row['to_implementation_sha256'])
          existing = {
              (item['from_implementation_sha256'], item['to_implementation_sha256'])
              for item in document['transitions']
          }
          if key in existing:
              raise SystemExit('transition already present; refusing duplicate')
          document['transitions'].append(row)
          path.write_text(json.dumps(document, separators=(',', ':'), ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          rm .github/workflows/zg016-transition-helper.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add examples/zg024a_implementation_transitions.json .github/workflows/zg016-transition-helper.yml
          git commit -m 'ZG-024a: review #107 implementation transition'
          git push origin HEAD:repair/zg016-107-automation-capability

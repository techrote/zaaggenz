name: ZG-021 band-selective DSP
on:
  pull_request:
    paths:
      - 'zaaggenz_dsp/**'
      - 'zaaggenz_spectral/**'
      - 'zaaggenz_contracts/**'
      - 'zaaggenz_project/**'
      - 'zaaggenz_timeline/**'
      - 'zaaggenz_melody/**'
      - 'tests/rack/**'
      - 'zaaggenz_components/**'
      - 'docs/dsp/MBR002_COMPOSE_EXECUTION.md'
      - 'docs/dsp/MBR001_EDITABLE_RACK.md'
      - 'tests/dsp/**'
      - 'tests/spectral/**'
      - 'tools/band_selective_report.py'
      - 'tools/mbr002_report.py'
      - 'examples/zg021_band_selective.json'
      - 'docs/dsp/ZG021_BAND_SELECTIVE_DSP.md'
      - '.github/workflows/zg021-band-selective.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  band-selective:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env: {PYTHONUTF8: '1', OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1'}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Materialize authenticated legacy baseline
        run: python baseline/recovered_source/materialize_v2.py --out .
      - name: Install dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 -r requirements-contracts.txt -r requirements-jobs.txt
      - name: DSP acceptance and regressions
        run: python -m unittest discover -s tests/dsp -v
      - name: Spectral acceptance and regressions
        run: python -m unittest discover -s tests/spectral -v
      - name: MBR-001/002 saved rack, numerical parity and real Compose API execution
        run: python -m unittest discover -s tests/rack -v
      - name: Frozen 48 kHz band isolation evidence
        run: python tools/band_selective_report.py --out band-selective-evidence.json
      - name: MBR-002 actual Compose 12/48 kHz WAV and context evidence
        run: python tools/mbr002_report.py --out mbr002-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: band-selective-evidence-${{ matrix.os }}
          path: |
            band-selective-evidence.json
            mbr002-evidence/

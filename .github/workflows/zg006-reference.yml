name: ZG-006 private reference safety
on:
  pull_request:
    paths:
      - 'zaaggenz_reference/**'
      - 'references/**'
      - 'tests/reference/**'
      - 'tools/check_reference_safety.py'
      - 'docs/references/**'
      - '.github/workflows/zg006-reference.yml'
      - '.gitignore'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env: {PYTHONUTF8: '1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install descriptor dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 -r requirements-contracts.txt
      - name: Test registry descriptors annotations and safety
        run: python -m unittest discover -s tests/reference -v
      - name: Explicit repository private-media scan
        run: python tools/check_reference_safety.py

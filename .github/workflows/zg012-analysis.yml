name: ZG-012 multiresolution analysis
on:
  pull_request:
    paths:
      - 'zaaggenz_analysis/**'
      - 'tests/analysis/**'
      - 'docs/analysis/**'
      - '.github/workflows/zg012-analysis.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analysis:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env: {PYTHONUTF8: '1', OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install numerical and contract dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 -r requirements-contracts.txt
      - name: Analysis tests
        run: python -m unittest discover -s tests/analysis -v

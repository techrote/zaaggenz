name: ZG-016 validated DSP graph
on:
  pull_request:
    paths:
      - 'zaaggenz_dsp/**'
      - 'zaaggenz_contracts/registry.py'
      - 'tests/dsp/**'
      - 'docs/dsp/**'
      - '.github/workflows/zg016-dsp.yml'
permissions:
  contents: read
jobs:
  dsp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env: {PYTHONUTF8: '1', OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Materialize authenticated baseline
        run: python baseline/recovered_source/materialize_v2.py --out .
      - name: Install dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 -r requirements-contracts.txt
      - name: DSP graph tests
        run: python -m unittest discover -s tests/dsp -v

name: ZG-017 partial spectral retune
on:
  pull_request:
    paths:
      - 'zaaggenz_spectral/**'
      - 'tests/spectral/**'
      - 'tools/spectral_retune_report.py'
      - 'docs/spectral/**'
      - '.github/workflows/zg017-spectral.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spectral:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env: {PYTHONUTF8: '1', OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 -r requirements-contracts.txt
      - name: ZG-017 acceptance tests
        run: python -m unittest discover -s tests/spectral -v
      - name: Component, tuning and scheduler regressions
        run: |
          python -m unittest discover -s tests/components -v
          python -m unittest discover -s tests/tuning -v
          python -m unittest discover -s tests/jobs -v
      - name: Full-rate deterministic evidence
        run: python tools/spectral_retune_report.py --sample-rate 48000 --out spectral-retune-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spectral-retune-evidence-${{ matrix.os }}
          path: spectral-retune-evidence.json

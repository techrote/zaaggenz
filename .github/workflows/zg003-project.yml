name: ZG-003 immutable project state
on:
  pull_request:
    paths:
      - 'zaaggenz_project/**'
      - 'tests/project/**'
      - 'docs/project/**'
      - '.github/workflows/zg003-project.yml'
      - 'zaaggenz_contracts/**'
permissions:
  contents: read
jobs:
  project:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Materialize authenticated baseline
        run: python baseline/recovered_source/materialize_v2.py --out .
      - name: Install dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 -r requirements-contracts.txt
      - name: Project tests
        run: python -m unittest discover -s tests/project -v

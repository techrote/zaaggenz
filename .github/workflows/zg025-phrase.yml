name: ZG-025 phrase roles and variation windows
on:
  pull_request:
    paths:
      - 'zaaggenz_phrase/**'
      - 'tests/phrase/**'
      - 'tools/phrase_fixture_report.py'
      - 'docs/phrase/**'
      - 'examples/phrases/**'
      - '.github/workflows/zg025-phrase.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phrase:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Capture exact tracked source
        run: git archive --format=zip --output=verification-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: zg025-source-${{ matrix.os }}
          path: verification-source.zip
          retention-days: 7
      - name: Materialize authenticated v1.2.1 source
        run: python baseline/recovered_source/materialize_v2.py --out .
      - name: Install numerical and shared dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 -r requirements-contracts.txt -r requirements-jobs.txt
      - name: Phrase-role validation, independence, timeline and source-preserving integration
        run: python -m unittest discover -s tests/phrase -v
      - name: Accepted melody and timeline regressions
        run: |
          python -m unittest discover -s tests/melody -v
          python -m unittest discover -s tests/timeline -v
      - name: Full-rate generated-source matched comparisons
        run: python tools/phrase_fixture_report.py --out phrase-fixtures-48k.json --audio-dir phrase-listening-48k --sample-rate 48000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zg025-phrase-${{ matrix.os }}
          path: |
            phrase-fixtures-48k.json
            phrase-listening-48k/

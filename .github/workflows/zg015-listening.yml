name: ZG-015 blinded listening and annotation
on:
  pull_request:
    paths:
      - 'zaaggenz_listening/**'
      - 'web/listening/**'
      - 'tests/listening/**'
      - 'tools/listening_fixture_report.py'
      - 'docs/listening/**'
      - '.github/workflows/zg015-listening.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  listening:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Capture exact tracked source
        run: git archive --format=zip --output=verification-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: zg015-source-${{ matrix.os }}
          path: verification-source.zip
          retention-days: 7
      - name: Materialize authenticated v1.2.1 source
        run: python baseline/recovered_source/materialize_v2.py --out .
      - name: Install numerical, shared and browser-test dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 -r requirements-contracts.txt -r requirements-jobs.txt playwright==1.57.0
      - name: Install Chromium with Linux dependencies
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: python -m playwright install chromium
      - name: Immutable stimuli, matching, trial/result and HTTP tests
        run: python -m unittest discover -s tests/listening -v
      - name: Accepted project, jobs, timeline, QC and stale-result regressions
        run: |
          python -m unittest discover -s tests/project -v
          python -m unittest discover -s tests/jobs -v
          python -m unittest discover -s tests/timeline -v
          python -m unittest discover -s tests/qc -v
          node tests/jobs/browser_transport.mjs
      - name: Full-rate matched listening fixtures and manifests
        run: python tools/listening_fixture_report.py --out listening-fixtures-48k.json --artifact-dir listening-evidence-48k --sample-rate 48000
      - name: Real browser freeze, match, opaque ABX, response, export and Compose independence
        run: python tests/listening/browser.py --out listening-browser-acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zg015-listening-${{ matrix.os }}
          path: |
            listening-fixtures-48k.json
            listening-evidence-48k/
            listening-browser-acceptance/

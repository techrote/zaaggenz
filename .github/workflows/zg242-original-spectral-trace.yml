name: MBR-004 source-matched spectral replay (diagnostic only)

on:
  push:
    branches: [mbr-004/spectral-stage-oracle-20261109]
    paths:
      - '.github/workflows/zg242-original-spectral-trace.yml'
      - 'tools/zg242_spectral_portability_trace.py'
      - 'tests/acceptance/test_zg242_spectral_trace.py'

permissions:
  contents: read
  actions: read

jobs:
  capture:
    name: normal-source-replay (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            host: ubuntu
            artifact_id: '13664143795'
            archive_sha256: ccdc37f723f3837618d259298f5745d94deeceaf57029598b3e12eb45669cfcc
          - os: windows-latest
            host: windows
            artifact_id: '13664820614'
            archive_sha256: 9cbf9dbbb01dd236facc00b528c66e023c472bf7f601f99658026567dae42abc
    env:
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      ORIGINAL_RUN_ID: '42597270382'
      ORIGINAL_ARTIFACT_ID: ${{ matrix.artifact_id }}
      ORIGINAL_ARCHIVE_SHA256: ${{ matrix.archive_sha256 }}
      TRACE_HOST: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Materialize authenticated accepted source
        run: python baseline/recovered_source/materialize_v2.py --out .
      - name: Install original numerical pins and existing requirements
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 -r requirements-contracts.txt -r requirements-jobs.txt
      - name: Execute read-only trace adversarial tests
        run: python -m unittest discover -s tests/acceptance -p test_zg242_spectral_trace.py -v
      - name: Retrieve exact original timeline artifact ZIP; reject wrong digest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/techrote/zaaggenz/actions/artifacts/${ORIGINAL_ARTIFACT_ID}/zip" \
            --output original-zg009.zip
          printf '%s  %s\n' "${ORIGINAL_ARCHIVE_SHA256}" original-zg009.zip | sha256sum --check
      - name: Trace NORMAL saved-source rack; no frozen dry substitution
        shell: bash
        run: |
          set -euo pipefail
          python tools/zg242_spectral_portability_trace.py capture \
            --artifact original-zg009.zip \
            --document rack-order-compression-then-spectral.zgtimeline.json \
            --out "trace-${TRACE_HOST}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zg242-source-trace-${{ matrix.host }}
          path: trace-${{ matrix.host }}.json
          if-no-files-found: warn
          retention-days: 14

  compare:
    name: cross-host decision comparison (not admission)
    needs: capture
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install matched numerical libraries
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - uses: actions/download-artifact@v4
        with:
          pattern: zg242-source-trace-*
          path: evidence
          merge-multiple: true
      - name: Stage-local decision comparison; do not adopt PCM tolerance
        run: python tools/zg242_spectral_portability_trace.py compare --ubuntu evidence/trace-ubuntu.json --windows evidence/trace-windows.json --out stage-local-decision-matrix.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zg242-stage-local-original-comparison
          path: stage-local-decision-matrix.json
          if-no-files-found: warn
          retention-days: 14

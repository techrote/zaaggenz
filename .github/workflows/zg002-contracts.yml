name: ZG-002 contracts and legacy equivalence
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Materialize authenticated unmodified baseline
        run: python baseline/recovered_source/materialize_v2.py --out .
      - name: Install declared numerical and metadata dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 -r requirements-contracts.txt
      - name: Validate contracts, interoperability and inherited behaviour
        run: python tools/check_contracts.py --baseline --report contracts-check.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contracts-${{ matrix.os }}
          path: contracts-check.json
